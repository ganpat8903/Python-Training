<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <body>
        <!-- The <meter> tag defines a scalar measurement within a known range, or a 
            fractional value. This is also known as a gauge. -->
        <label>Disk usage C:</label>
        <meter value="3" min="0" max="10">3 out of 10</meter><br>
        <label>Disk usage D:</label>
        <meter value="0.8">80%</meter>
        <!-- The <progress> tag represents the completion progress of a task.
            The <progress> tag displays a horizontal progress bar. -->
        <label for="file">Progress:</label>
        <progress value="50" max="100"> 50%</progress>
    </body>

</html>
