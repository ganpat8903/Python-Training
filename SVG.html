<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- SVG stands for Scalable Vector Graphics. -->
    <!-- An SVG image contains special SVG tags that draw different shapes, text, and graphics. -->
    <svg width="100" height="100" style="border: 2px solid;">
        <circle cx="50" cy="50" r="40" stroke="blue" stroke-width="5" fill="red" />
    </svg>
    <svg height="150" width="500" style="border: 2px solid;">
        <ellipse cx="250" cy="75" rx="125" ry="37.5" stroke="blue" stroke-width="5" fill="red" />
    </svg>
    <svg width="300" height="300">
        <rect width="200" height="100" fill="red" stroke="blue" stroke-width="5" />
    </svg>
    <svg width="300" height="300">
        <!-- square -->
        <rect width="200" height="200" fill="red" stroke="blue" stroke-width="5" />
    </svg>
    <svg height="100" width="200">
        <text x="50" y="6660" fill="green" stroke="red" stroke-width="1">Welcome to HTML</text>
    </svg>
</body>

</html>
