<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .mydiv {
            background-color: yellow;
            border: red solid 1px;
            position: absolute;
            /* static(by default) | fixed | absolute | relative */
            /* in static we cannot use left,right,top,bottom.
               in relative we can use. */
            /* Absolute will start from Top of the Browser . */
            left: 100px;
            top: 15px;

        }
    </style>
</head>

<body>
    <h1>Content Start </h1>
    <div class="mydiv">
        This div has relative positioning
    </div>
</body>

</html>
