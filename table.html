<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        th,
        td {
            border: 1px solid black;
            /* border-collapse: collapse; */
            border-spacing: 5px;
        }

        th {
            height: 50px;
        }

        td {
            height: 50px;
            vertical-align: bottom;
        }

        tr:nth-child(odd) {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #1cc1567b;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
        </tr>
        <tr>
            <td>Akash</td>
            <td>Padhiyar</td>
        </tr>
        <tr>
            <td>Akash</td>
            <td>Technolabs</td>
        </tr>
    </table>
</body>

</html>
