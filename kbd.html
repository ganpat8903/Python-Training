<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- The <kbd> tag is used to define keyboard input. 
The content inside is displayed in the browser's default monospace font -->
    <p>Press <kbd>Ctrl+c</kbd> to copy
        text.</p>
    <p style="font-family: monospace;">Press Ctrl+c to copy text.</p>
</body>

</html>
