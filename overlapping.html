<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            z-index: -1;
        }

        div {
            position: absolute;
            height: 100px;
            top:0px;
            background-color: yellow;
            border: red solid 1px;
            z-index: -1
        }
    </style>
</head>

<body>
    <!-- When elements are positioned, they can overlap other elements.
            Use z-index properties at that time. -->
    <img src="image1.jpg" alt="">
    <div>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatibus veritatis deleniti a ea recusandae
        inventore, rem aspernatur amet officia, nemo debitis. Assumenda quaerat, odio quia asperiores facere delectus!
        Aliquam, reiciendis?
    </div>
</body>

</html>
