<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math</title>
    <script>
        // abs() :- returns an absolute value of a given number(give always positive number)
        document.writeln("<h2 style='margin-bottom:0px'>abs()</h2>")
        document.writeln(Math.abs(-20) + "<br>") // negative to positive
        document.writeln(Math.abs(20.21) + "<br>") // positive to positive

        // ceil() :- increment by 1 and give in integer, does not see the decimal part
        document.writeln("<h2 style='margin-bottom:0px'>ceil()</h2>")
        document.writeln(Math.ceil(1.234) + "<br>")
        document.writeln(Math.ceil(1.74) + "<br>")

        // floor() :- give in integer, does not see the decimal part
        document.writeln("<h2 style='margin-bottom:0px'>floor()</h2>")
        document.writeln(Math.floor(1.234) + "<br>")
        document.writeln(Math.floor(1.74) + "<br>")

        // max() :- returns the maxmium value
        document.writeln("<h2 style='margin-bottom:0px'>max()</h2>")
        document.writeln(Math.max(1, 2, -333, 0, 3) + "<br>")
        document.writeln(Math.max(true, false) + "<br>")

        // min() :- returns the minimum value
        document.writeln("<h2 style='margin-bottom:0px'>min()</h2>")
        document.writeln(Math.min(1, 2, -333, 0, 3) + "<br>")
        document.writeln(Math.min(true, false) + "<br>")

        // pow() :- returns the base to the exponent power
        document.writeln("<h2 style='margin-bottom:0px'>pow()</h2>")
        document.writeln(Math.pow(2,4) + "<br>")
        document.writeln(Math.pow(2,3) + "<br>")

        // random() :- returns the random number between 0 (inclusive) and 1 (exclusive)
        document.writeln("<h2 style='margin-bottom:0px'>random()</h2>")
        document.writeln(Math.random() + "<br>")
        document.writeln(Math.random() + "<br>")

        // round() :- returns the nearest integer
        document.writeln("<h2 style='margin-bottom:0px'>round()</h2>")
        document.writeln(Math.round(2.43) + "<br>")
        document.writeln(Math.round(2.55) + "<br>")
        document.writeln(Math.round(2.85) + "<br>")

        // sqrt() :- returns the square root of a number
        document.writeln("<h2 style='margin-bottom:0px'>sqrt()</h2>")
        document.writeln(Math.sqrt(16) + "<br>")
        document.writeln(Math.sqrt(8) + "<br>")

        // trunc() :- removes the fractional part of the given number and returns the remaining integer part only.
        document.writeln("<h2 style='margin-bottom:0px'>trunc()</h2>")
        document.writeln(Math.trunc(2.345) + "<br>")
        document.writeln(Math.trunc(2.788) + "<br>")
    </script>
</head>

<body>

</body>

</html>
