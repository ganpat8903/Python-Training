<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a1:link{
            /* a normal, unvisited link */
            color: red;
        }
        .a1:visited{
            /* a link the user has visited */
            color: green;
        }
        .a1:hover{
            /* a link when the user mouse over it */
            color: aqua;
            font-size: 30px;
        }
        .a1:active{
            /* a link the moment it is clicked */
            color : orange;
        }
        .a1{
            text-decoration: none;
        }
    </style>
</head>
<body>
    <a class="a1" href="basics.html">Click Me</a><br>
    <a href="background.html" target="_blank">Click me...</a>
</body>
</html>
