<!-- The <frameset> tag not supported in HTML5.
 The <frameset> tag was used in HTML 4 to define a frameset. -->
<html>
<frameset rows='50%,*'>
    <frame src="table.html">
        <frameset cols="50%,50%">
            <frame src="list.html">
            <frame src="marquee.html">
        </frameset>
</frameset>
</html>
