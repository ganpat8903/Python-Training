<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color: red;
            text-align: center;
            border:2px solid blue;
            text-decoration:underline; /*Text decoration can be underline, overline, line-through or none.*/
            text-transform: lowercase;/*Text transform can be lowercase, uppercase, capitalize.*/
            word-spacing: 10px; /*to specify the space  between the words in a text.*/
            text-shadow: 5px 5px 6px yellow; /* ( horizontal size, vertical size, blur effect size, shadow color) */
        }
        p{
            border: 2px solid green;
            text-indent: 30px;
            line-height: 100px; /*This property is used to set the space between the lines*/
            letter-spacing: 10px; /*to specify the space  between the characters in a text*/
        }
    </style>
</head>

<body>
    <h1>This is h1 tag ....</h1>
    <p>This is p tag ....</p>
    <p>This is another p tag ....</p>
</body>

</html>
