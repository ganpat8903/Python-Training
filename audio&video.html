<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <audio controls autoplay muted loop>
        <source src="song1.mp3" type="audio/mpeg">
        <source src="song2.mp3" type="audio/mpeg">
    </audio>
    <!-- Preload : The preload option is none. The video is only loaded when the start button is clicked. -->
    <video controls height="200px" width="200px" autoplay preload="none" loop muted>
        <source src="video2.mp4" type="video/mp4">
    </video>
</body>
</html>
