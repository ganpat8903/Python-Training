<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .p1 {
            /* Resize has three values:- vertical, horizontal and both. */
            border: 2px solid;
            padding: 20px;
            width: 300px;
            resize: both;
            overflow: auto;
        }

        .div1 {
            width: 300px;
            height: 100px;
            border: 5px solid blue;
            box-sizing: border-box;
        }

        .div2 {
            width: 300px;
            height: 100px;
            padding: 50px;
            border: 5px solid red;
            box-sizing:content-box;
        }
    </style>
</head>

<body>
    <!-- CSS3 has new user interface features such as resizing elements, outlines, and box sizing. -->
    <p class="p1">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Deleniti ut blanditiis iure
        inventore numquam saepe perferendis nobis distinctio fuga consequuntur neque tenetur, eligendi
        sapiente debitis laboriosam molestiae ipsam nesciunt suscipit.</p>

    <!-- The CSS3 box-sizing property allows us to include the padding and border in 
an element's total width and height. -->
    <div class="div1">This is div1.</div>
    <br>
    <div class="div2">This is div2.</div>
</body>

</html>
