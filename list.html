<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <!-- type="disc"(by default) or type="circle" or type="square" -->
    <ul type="square">
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ul>
    <!-- type="A" or type="a" or type="I" or type="i" or type="1"(by default) -->
     <!-- reversed is used to reverse the number of list eg 1 2 3 will be 3 2 1 but item sequence will be same -->
    <ol type="I"  start="4" reversed>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ol>
    <ol type="I"  start="4">
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ol>
    <dl>
        <dt>item 1</dt>
        <dd>description 1</dd>
        <dt>item 2</dt>
        <dd>description 2</dd>
    </dl>
    <hr>
    <h1>Task</h1>
    <ul>
        <li>Fruit</li>
        <ul type="circle">
            <li>Banana</li>
            <li>Apple</li>
            <ol type="a">
                <li>Red</li>
                <li>Green</li>
            </ol>
            <li>Pears</li>
        </ul>
        <li>Vegetables</li>
        <li>Meat</li>
    </ul>
    <hr>
</body>
</html>
