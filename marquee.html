<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marquee</title>
</head>

<body>
    <!-- HTML Marquee tag is used to scroll text or images either horizontal or vertical direction.  -->
    <!-- direction="left"(by default) or direction="right" or direction="up" or direction="down" -->
    <!-- behavior="scroll"(by default) or behavior="alternate" -->
    <!-- loop is used to repeat the marquee -->
    <!-- scrollamount(by default 6) is used to set the speed -->
    <marquee behavior="alternate" direction="left" height="100px" width="700px" bgcolor="zebra" scrollamount="15">
        🚗💨</marquee>
    <marquee behavior="scroll" direction="up" height="500px" width="500px" bgcolor="skyblue" loop="2">
        ✈︎ </marquee>
</body>

</html>
