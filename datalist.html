<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- The <datalist> tag creates a list of data items.
       T This list is used by a textbox which displays the data items in a dropdown -->
    <input type="text" list="programming" name="code">
    <datalist id="programming">
    <option value="HTML">
    <option value="Css">
    <option value="Bootstrap">
    <option value="Java SCRIPT">
    </datalist>
    <input type="submit">
</body>
</html>
